name: Update Profile Metrics

on:
  schedule:
    # Runs every day at 00:00 UTC. Change the cron if you want a different frequency.
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Lets you trigger it manually from the Actions tab whenever you want

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          # Which sections to render — feel free to trim this list down later
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
